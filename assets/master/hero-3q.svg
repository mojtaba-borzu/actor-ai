<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768" role="img" aria-label="Character master, three-quarter view">
<!-- MASTER v2. Canon: 768x768 canvas, character height 512 (top y=188, sole y=700), H=78.8,
     ground anchor (384,700). Layer ids follow docs/03-production-pipeline.md. Do not move the anchor. -->
<defs>
  <style>
    .k0{fill:#080B10}.k1{fill:#11161D}.k2{fill:#1B222C}.k3{fill:#2A3441}.k4{fill:#3E4B5C}
    .k5{fill:#6C7788}.k6{fill:#9AA5B5}
    .sk{fill:#F2D6C0}.skd{fill:#D9AE96}.skl{fill:#7A4E3F}
    .h1{fill:#1A1613}.h2{fill:#2A2320}.h3{fill:#46392F}
    .ct{stroke:#080B10;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .in{stroke:#080B10;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;fill:none}
    .sl{stroke:#7A4E3F;stroke-width:2.4;stroke-linecap:round;fill:none}
  </style>
  <filter id="halo" x="-12%" y="-12%" width="124%" height="124%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/>
    <feFlood flood-color="#E6EDF4" flood-opacity="0.55"/>
    <feComposite in2="d" operator="in" result="h"/>
    <feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- FX slot order is canon: ground, back, [character], sword, blade, front, rim -->
<g id="fx_ground"></g>
<g id="fx_back"></g>

<g id="character" filter="url(#halo)">

  <!-- medium-short back mass: ends at the jaw, never below -->
  <g id="hair_back">
    <path class="h1 ct" d="M344 234c-5-34 12-58 40-58s45 24 40 58c-2 14-4 22-7 30l-11-8c3-10 4-18 4-27-1-24-12-36-26-36s-25 12-26 36c-1 9 0 17 3 27l-11 8c-3-8-5-16-6-30z"/>
  </g>

  <g id="leg_far">
    <path class="k1 ct" d="M394 416 L438 416 L433 554 L429 680 L399 680 L401 554 Z"/>
    <path class="k1 ct" d="M396 640h34l2 40c1 8-4 13-13 13h-44c-8 0-10-7-4-11z"/>
    <path class="k4" d="M373 678h59v8h-59z"/>
  </g>

  <g id="leg_near">
    <path class="k2 ct" d="M336 416 L386 416 L381 554 L377 684 L339 684 L341 554 Z"/>
    <path class="k3" d="M338 420h48l-2 48h-46z"/>
    <path class="in" d="M337 488h46"/>
    <path class="k1 ct" d="M338 648h38l2 40c1 9-5 14-14 14h-52c-9 0-11-7-4-12z"/>
    <path class="k4" d="M310 692h68v8h-68z"/>
  </g>

  <g id="torso">
    <!-- jacket: sloped shoulders, nipped waist, slight flare at the hem -->
    <path class="k2 ct" d="M318 302c6-11 26-19 45-18l21 5 21-5c19-1 39 7 45 18l-10 26-7 54 3 42c-33 5-70 5-104 0l3-42-7-54z"/>
    <path class="k3" d="M322 304c6-9 24-15 41-14l21 5 21-5c17-1 35 6 41 14l-7 18-18-8-37 6-37-6-18 8z"/>
    <path class="in" d="M366 306l-5 60 3 58"/>
    <path class="in" d="M336 344h96M338 392h92"/>
    <path class="k1" d="M334 412c33 5 70 5 104 0l1 12c-34 5-72 5-106 0z"/>
    <g id="emblem" fill="none" stroke="#3E4B5C" stroke-width="3" stroke-linecap="round">
      <path d="M356 334h-12a4 4 0 0 0-4 4v14a4 4 0 0 0 4 4h14a4 4 0 0 0 4-4v-12"/>
      <path d="M336 360l30-30"/>
    </g>
    <rect x="363" y="327" width="7" height="7" class="k4"/>
    <!-- collar + chest V (K5/K6): the head/torso value break -->
    <path class="k5 ct" d="M358 282h52l7 20-33 6-33-6z"/>
    <path class="k6" d="M365 285h38l4 11-23 5-23-5z"/>
    <path class="k5" d="M369 298l15 34 15-34 9 5-24 45-24-45z"/>
  </g>

  <g id="arm_far">
    <path class="k2 ct" d="M436 300c11 3 18 10 18 20l-6 58-4 46h-26l5-46 5-58z"/>
    <path class="k4" d="M420 416h24v8h-24z"/>
    <path class="sk ct" d="M422 424h22c5 0 7 4 6 9l-4 40c-1 8-5 12-12 12s-11-5-11-13l-3-39c0-5 0-9 2-9z"/>
    <path class="sl" d="M443 434c4 2 5 6 4 11"/>
  </g>

  <g id="arm_near">
    <path class="k2 ct" d="M332 300c-12 3-19 10-19 20l7 58 5 46h27l-6-46-5-58z"/>
    <path class="k3" d="M334 304c-8 3-13 7-13 14l5 28 18-3-5-28z"/>
    <path class="k4" d="M324 416h26v8h-26z"/>
    <path class="sk ct" d="M326 424h24c-4 0-6 4-5 9l4 41c1 8 5 13 13 13s12-5 11-13l-4-41c0-5-3-9-7-9z"/>
    <path class="sl" d="M345 436c6 1 9 5 9 11"/>
  </g>

  <g id="neck">
    <path class="sk ct" d="M370 248h28v46h-28z"/>
    <path class="skd" d="M370 248h28v20c-9 7-19 7-28 0z"/>
  </g>

  <g id="head">
    <path class="sk ct" d="M349 222c0-25 14-38 33-38s33 13 33 38c0 17-3 28-9 37-7 9-15 13-24 13-10 0-21-7-27-19-4-9-6-19-6-31z"/>
    <path class="skd" d="M406 259c-7 9-15 13-24 13l-4-7c11-1 20-6 26-13z"/>
    <path class="sk ct" d="M345 230a6 10 0 1 0 0 20z"/>
    <g id="brows" class="h1">
      <path d="M350 226c8-7 17-9 27-7l-1 8c-9-2-17 0-24 6z"/>
      <path d="M391 219c7-1 13 1 18 6l-3 6c-4-4-10-6-15-5z"/>
    </g>
    <g id="eye_near">
      <ellipse cx="365" cy="236" rx="11" ry="7.4" fill="#F5F7FA"/>
      <circle cx="366" cy="236" r="6" fill="#3A3028"/>
      <circle cx="366" cy="236" r="2.8" fill="#140F0C"/>
      <circle cx="368.6" cy="232.8" r="1.7" fill="#FFFFFF"/>
      <path d="M354 235c2-7 7-10 12-10s9 3 11 7l-2 3c-3-4-6-6-10-6-4 0-8 3-9 8z" class="h1"/>
      <path d="M355 244h20" stroke="#27D9D0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
    <g id="eye_far">
      <ellipse cx="399" cy="235" rx="8" ry="7" fill="#F5F7FA"/>
      <circle cx="398" cy="235" r="5.5" fill="#3A3028"/>
      <circle cx="398" cy="235" r="2.6" fill="#140F0C"/>
      <circle cx="400" cy="232" r="1.5" fill="#FFFFFF"/>
      <path d="M391 234c1-6 5-9 8-9s7 2 8 6l-2 3c-2-3-4-5-7-5-3 0-5 2-6 6z" class="h1"/>
      <path d="M391 243h15" stroke="#27D9D0" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
    <path class="sl" d="M394 247c2 3 4 5 7 5"/>
    <path class="skl" d="M372 260h15v3.4h-15z"/>
  </g>

  <g id="hair_front">
    <path class="h2 ct" d="M347 222c-3-26 13-43 37-43 23 0 38 16 37 40-7-15-19-24-35-24-9 9-16 15-26 18z"/>
    <path class="h3" d="M355 200c7-10 17-16 29-16 13 0 23 5 29 14-8-7-17-10-29-10s-22 4-29 12z"/>
    <path class="h2 ct" d="M350 207c9-2 17-8 24-15 5 11 3 26-6 39-5-9-11-16-18-19z"/>
    <path class="h2 ct" d="M409 189c9 6 14 16 12 29-4-9-10-16-17-20z"/>
    <path class="h2 ct" d="M407 191l30-23-15 34z"/>
  </g>

</g>

<g id="sword_slot"></g>
<g id="fx_blade"></g>
<g id="fx_front"></g>
<g id="fx_rim"></g>
</svg>
